name: Build & Deploy

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/blog-feed:latest

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER || 'ec2-user' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo docker system prune -af --filter until=24h
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/blog-feed:latest
            sudo docker rm -f blog-feed 2>/dev/null || true
            sudo docker run -d --name blog-feed -p 8765:8765 \
              -v /home/ec2-user/data:/app/data \
              --env DEEPSEEK_API_KEY='${{ secrets.DEEPSEEK_API_KEY }}' \
              --env DEEPSEEK_MODEL='${{ secrets.DEEPSEEK_MODEL || 'deepseek-v4-flash' }}' \
              --env BLOG_SCOUT_API_KEY='${{ secrets.BLOG_SCOUT_API_KEY }}' \
              --restart unless-stopped \
              ${{ secrets.DOCKER_USERNAME }}/blog-feed:latest
            sudo docker image prune -f
